<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 GitHub Achievements - Bloosm Flower Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .achievement-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 100%);
            min-height: 100vh;
            color: white;
        }

        .achievement-header {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .achievement-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            min-width: 120px;
            backdrop-filter: blur(5px);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #FF1493;
            display: block;
        }

        .customer-selector {
            text-align: center;
            margin: 30px 0;
        }

        .customer-selector select {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            background: white;
            color: #333;
            font-size: 16px;
            margin: 0 10px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .achievement-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .achievement-card.unlocked {
            background: rgba(255, 182, 193, 0.4);
            border-color: #FF1493;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.3);
            transform: translateY(-5px);
        }

        .achievement-card.unlocked::before {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 15px;
            color: #FF1493;
            font-size: 20px;
            font-weight: bold;
        }

        .achievement-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .achievement-icon {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .achievement-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #FF1493;
        }

        .achievement-description {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .achievement-points {
            background: rgba(255, 20, 147, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            color: #FF1493;
        }

        .achievement-progress {
            margin-top: 15px;
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.2);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            background: linear-gradient(90deg, #FF1493, #FF69B4);
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .achievement-level {
            position: absolute;
            top: 10px;
            left: 15px;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.7em;
            font-weight: bold;
        }

        .level-bronze { background: #CD7F32; }
        .level-silver { background: #C0C0C0; }
        .level-gold { background: #FFD700; color: #000; }
        .level-platinum { background: #FFC0CB; color: #000; }
        .level-diamond { background: #FF1493; color: #fff; }

        .category-filter {
            text-align: center;
            margin: 20px 0;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: #FF1493;
            color: #fff;
        }

        .no-achievements {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .recent-achievements {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 25px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
        }

        .recent-achievement-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .recent-achievement-item:last-child {
            border-bottom: none;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="achievement-page">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Shop
        </a>

        <div class="achievement-header">
            <h1>🏆 GitHub-Style Achievements</h1>
            <p>Unlock badges and earn points by shopping with Bloosm!</p>
            
            <div class="customer-selector">
                <label for="customerSelect">Select Customer:</label>
                <select id="customerSelect">
                    <option value="">Choose a customer...</option>
                </select>
                <button onclick="loadCustomerAchievements()" style="margin-left: 10px; padding: 10px 20px; background: #FF1493; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
                    Load Achievements
                </button>
            </div>

            <div class="achievement-stats" id="achievementStats" style="display: none;">
                <div class="stat-card">
                    <span class="stat-number" id="unlockedCount">0</span>
                    <span>Unlocked</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="totalPoints">0</span>
                    <span>Points</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="completionPercentage">0%</span>
                    <span>Complete</span>
                </div>
            </div>
        </div>

        <div class="category-filter" id="categoryFilter" style="display: none;">
            <button class="filter-btn active" onclick="filterAchievements('ALL')">All</button>
            <button class="filter-btn" onclick="filterAchievements('PURCHASE')">Purchase</button>
            <button class="filter-btn" onclick="filterAchievements('LOYALTY')">Loyalty</button>
            <button class="filter-btn" onclick="filterAchievements('MILESTONE')">Milestone</button>
            <button class="filter-btn" onclick="filterAchievements('SEASONAL')">Seasonal</button>
            <button class="filter-btn" onclick="filterAchievements('SPECIAL')">Special</button>
        </div>

        <div class="recent-achievements" id="recentAchievements" style="display: none;">
            <h3>🆕 Recently Unlocked</h3>
            <div id="recentAchievementsList"></div>
        </div>

        <div class="achievements-grid" id="achievementsGrid">
            <div class="no-achievements">
                <i class="fas fa-trophy" style="font-size: 4em; opacity: 0.3; margin-bottom: 20px;"></i>
                <h3>Select a customer to view achievements</h3>
                <p>Choose a customer from the dropdown above to see their GitHub-style achievement progress!</p>
            </div>
        </div>
    </div>

    <script>
        let currentFilter = 'ALL';
        let allAchievements = [];
        let customerProgress = [];

        // Load customers on page load
        window.onload = function() {
            loadCustomers();
        };

        function loadCustomers() {
            fetch('/api/customers')
                .then(response => response.json())
                .then(customers => {
                    const select = document.getElementById('customerSelect');
                    select.innerHTML = '<option value="">Choose a customer...</option>';
                    customers.forEach(customer => {
                        const option = document.createElement('option');
                        option.value = customer.id;
                        option.textContent = `${customer.name} (${customer.email})`;
                        select.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading customers:', error);
                });
        }

        function loadCustomerAchievements() {
            const customerId = document.getElementById('customerSelect').value;
            if (!customerId) {
                alert('Please select a customer first!');
                return;
            }

            // Initialize achievements if not done yet
            fetch('/api/achievements/initialize', {
                method: 'POST'
            })
            .then(() => {
                // Load customer dashboard
                return fetch(`/api/achievements/customer/${customerId}/dashboard`);
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    displayAchievementStats(data);
                    allAchievements = data.allAchievements;
                    customerProgress = data.allProgress;
                    displayAchievements();
                    displayRecentAchievements(data.recentAchievements);
                    
                    // Show UI elements
                    document.getElementById('achievementStats').style.display = 'flex';
                    document.getElementById('categoryFilter').style.display = 'block';
                    document.getElementById('recentAchievements').style.display = 'block';
                } else {
                    alert('Failed to load achievements: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error loading achievements:', error);
                alert('Error loading achievements. Please try again.');
            });
        }

        function displayAchievementStats(data) {
            document.getElementById('unlockedCount').textContent = data.unlockedCount || 0;
            document.getElementById('totalPoints').textContent = data.totalPoints || 0;
            document.getElementById('completionPercentage').textContent = 
                Math.round(data.completionPercentage || 0) + '%';
        }

        function displayAchievements() {
            const grid = document.getElementById('achievementsGrid');
            grid.innerHTML = '';

            let filteredAchievements = allAchievements;
            if (currentFilter !== 'ALL') {
                filteredAchievements = allAchievements.filter(a => a.type === currentFilter);
            }

            if (filteredAchievements.length === 0) {
                grid.innerHTML = `
                    <div class="no-achievements">
                        <i class="fas fa-search" style="font-size: 4em; opacity: 0.3; margin-bottom: 20px;"></i>
                        <h3>No achievements in this category</h3>
                        <p>Try a different category filter!</p>
                    </div>
                `;
                return;
            }

            filteredAchievements.forEach(achievement => {
                const progress = customerProgress.find(p => p.achievement.id === achievement.id);
                const isUnlocked = progress && progress.unlocked;
                const currentProgress = progress ? progress.currentProgress : 0;
                const targetProgress = achievement.targetValue;
                const progressPercentage = Math.min((currentProgress / targetProgress) * 100, 100);

                const card = document.createElement('div');
                card.className = `achievement-card ${isUnlocked ? 'unlocked' : ''}`;
                
                card.innerHTML = `
                    <div class="achievement-level level-${achievement.level.toLowerCase()}">
                        ${achievement.level}
                    </div>
                    <div class="achievement-icon">${achievement.badgeIcon}</div>
                    <div class="achievement-title">${achievement.title}</div>
                    <div class="achievement-description">${achievement.description}</div>
                    <div class="achievement-points">+${achievement.pointsReward} points</div>
                    ${!isUnlocked && targetProgress > 1 ? `
                        <div class="achievement-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercentage}%"></div>
                            </div>
                            <div class="progress-text">${currentProgress}/${targetProgress}</div>
                        </div>
                    ` : ''}
                    ${isUnlocked ? `
                        <div style="margin-top: 15px; color: #FF1493; font-weight: bold;">
                            ✓ UNLOCKED!
                        </div>
                    ` : ''}
                `;

                grid.appendChild(card);
            });
        }

        function displayRecentAchievements(recentAchievements) {
            const container = document.getElementById('recentAchievementsList');
            
            if (!recentAchievements || recentAchievements.length === 0) {
                container.innerHTML = '<p style="opacity: 0.7;">No recent achievements</p>';
                return;
            }

            container.innerHTML = '';
            recentAchievements.slice(0, 5).forEach(item => {
                const achievement = item.achievement;
                const div = document.createElement('div');
                div.className = 'recent-achievement-item';
                div.innerHTML = `
                    <span style="font-size: 1.5em; margin-right: 15px;">${achievement.badgeIcon}</span>
                    <div>
                        <strong>${achievement.title}</strong><br>
                        <small style="opacity: 0.7;">Unlocked ${new Date(item.unlockedDate).toLocaleDateString()}</small>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterAchievements(category) {
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            currentFilter = category;
            displayAchievements();
        }
    </script>
</body>
</html>
